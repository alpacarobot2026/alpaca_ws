# twist_mux config: arbitrates /cmd_vel between face_speaker and MPPI.
#
# Face priority MUST be higher than nav. MPPI publishes zeros at 20 Hz even
# when idle, so if nav were higher those zeros would always win and
# face_speaker would never get through. face_speaker is disabled by the
# guidebot FSM during GUIDING, so it stops publishing, times out, and nav
# takes over.
#
# Run:
#   ros2 run twist_mux twist_mux --ros-args \
#     --params-file $(ros2 pkg prefix alpaca_navigation)/share/alpaca_navigation/config/twist_mux.yaml \
#     -r cmd_vel_out:=/cmd_vel
twist_mux:
  ros__parameters:
    topics:
      face:
        topic: /cmd_vel_face
        timeout: 0.3
        priority: 20
      nav:
        topic: /cmd_vel_mppi
        timeout: 0.5
        priority: 10
