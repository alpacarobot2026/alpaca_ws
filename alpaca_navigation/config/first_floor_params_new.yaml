# MPPI controller parameters loaded by mppi_controller_node.py --params-file
# DT / horizon_length / num_sample left unset → fall back to mppi_config.py constants
# First floor params
mppi:
  # Noise covariance
  cov_x: 0.5
  cov_z: 0.04  # 0.02, 0.015 worked well in lab

  # Temperature
  lambda_: 0.18 # worked well in lab

  # Goal costs
  goal_weight: 2000 #6000
  terminal_goal_weight: 100

  # Action smoothness costs
  action_weight: 100 #500
  action_t_weight: 50
  control_x_weight: 0

  # Steering costs
  steering_weight: 100 # 500 #1000
  steering_t_weight: 200
  control_z_weight: 200

  # Social / crowd costs
  sm_weight: 1
  cv_weight: 2 #100, #10000, 3000 worked well in lab

  # Costmap / collision costs
  costmap_weight: 200
  sigma_collision: 0.01
  beta_collision: 15.0
  decay_rate: -0.05  #-0.3

  # Heading cost
  heading_weight: 800

  # Control filters (EMA alpha)
  alpha_x: 0.1
  alpha_z: 0.3
