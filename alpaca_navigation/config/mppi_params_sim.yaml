# MPPI controller parameters loaded by mppi_controller_node.py --params-file
# DT / horizon_length / num_sample left unset → fall back to mppi_config.py constants
mppi:
  # Noise covariance
  cov_x: 0.5 #0.2
  cov_z: 0.06

  # Temperature
  lambda_: 0.18

  # Goal costs
  goal_weight: 2000 #2000
  terminal_goal_weight: 100 

  # Action smoothness costs
  action_weight: 100
  action_t_weight: 0
  control_x_weight: 0

  # Steering costs
  steering_weight: 100 #100 
  steering_t_weight: 0
  control_z_weight: 0

  # Social / crowd costs
  sm_weight: 1
  cv_weight: 1200

  # Costmap / collision costs
  costmap_weight: 100
  sigma_collision: 0.35
  beta_collision: 3.0
  decay_rate: -0.000001

  # Heading cost
  heading_weight: 0

  # Control filters (EMA alpha)
  alpha_x: 0.1
  alpha_z: 0.3
