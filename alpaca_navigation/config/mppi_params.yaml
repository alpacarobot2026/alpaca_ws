 # MPPI controller parameters loaded by mppi_controller_node.py --params-file
# DT / horizon_length / num_sample left unset → fall back to mppi_config.py constants
mppi:
  # Noise covariance
  cov_x: 0.5 #0.2
  cov_z: 0.04

  # Temperature
  lambda_: 0.18

  # Goal costs
  goal_weight: 2000 #2000
  terminal_goal_weight: 0 #100 

  # Action smoothness costs
  action_weight: 100
  action_t_weight: 0
  control_x_weight: 0

  # Steering costs
  steering_weight: 100 
  steering_t_weight: 0
  control_z_weight: 0

  # Social / crowd costs
  sm_weight: 1
  cv_weight: 2 #1 #1200

  # Costmap / collision costs
  costmap_weight: 200
  sigma_collision: 0.01
  beta_collision: 15.0
  decay_rate: -0.05  #-0.3

  # Heading cost
  heading_weight: 0
  
  # Control filters (EMA alpha)
  alpha_x: 0.1
  alpha_z: 0.3

  # alpha_x: 1.0
  # alpha_z: 1.0

  

  
 






